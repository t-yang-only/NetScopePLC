name: 功能建议
description: 新能力或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目刻意保持两文件单体，较大架构变更请先说明必要性。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 现场场景或痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或交互
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 可选
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（预估）
      options:
        - label: 仅 UI（MainWindow / App）
        - label: 原生扫描核心（netscope_native.c）
        - label: 构建 / 发布
        - label: 文档
